name: Portable Windows UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gui.py"
      - "batch.py"
      - "morpher.py"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/windows-portable.yml"
  push:
    branches: [main]
    paths:
      - "gui.py"
      - "batch.py"
      - "morpher.py"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/windows-portable.yml"

jobs:
  portable-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-gui.txt nuitka ordered-set zstandard
      - name: Run batch tests
        run: python -m unittest discover -s tests -v
      - name: Check Ukrainian dictionary
        run: python -c "from morpher import NameMorpher, SentenceMorpher; assert NameMorpher(SentenceMorpher()).morph_name('Іваненко Тарас Петрович', 'gent')"
      - name: Build portable standalone folder
        run: >-
          python -m nuitka
          --mode=standalone
          --assume-yes-for-downloads
          --enable-plugin=pyside6
          --include-package-data=pymorphy3_dicts_uk
          --windows-console-mode=disable
          --output-dir=dist
          --output-filename=UA-Morpher.exe
          gui.py
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/gui.dist/*" -DestinationPath "UA-Morpher-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: UA-Morpher-Windows-x64
          path: UA-Morpher-Windows-x64.zip
          if-no-files-found: error
